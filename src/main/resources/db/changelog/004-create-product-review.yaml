databaseChangeLog:

  - changeSet:
      id: 004-create-product-review
      author: Tural

      changes:

        - createTable:
            tableName: product_review

            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_review_product
                    references: products(id)

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_review_user
                    references: users(id)

              - column:
                  name: review
                  type: VARCHAR(1000)

              - column:
                  name: rate
                  type: INTEGER