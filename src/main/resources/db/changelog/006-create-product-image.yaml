databaseChangeLog:

  - changeSet:
      id: 006-create-product-image
      author: Tural

      changes:

        - createTable:
            tableName: product_image

            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_product_image_product
                    references: products(id)

              - column:
                  name: image_url
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false