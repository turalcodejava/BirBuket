databaseChangeLog:
  - changeSet:
      id: 002-create-addresses
      author: Tural
      changes:

        - createTable:
            tableName: addresses
            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_addresses_user
                    references: users(id)

              - column:
                  name: city
                  type: VARCHAR(255)

              - column:
                  name: district
                  type: VARCHAR(255)

              - column:
                  name: street
                  type: VARCHAR(255)

              - column:
                  name: building
                  type: VARCHAR(255)

              - column:
                  name: apartment
                  type: VARCHAR(255)

              - column:
                  name: full_address_line
                  type: VARCHAR(500)

              - column:
                  name: created_at
                  type: TIMESTAMP

              - column:
                  name: updated_at
                  type: TIMESTAMP